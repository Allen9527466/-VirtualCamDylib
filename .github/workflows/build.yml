name: Build VirtualCamDylib
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Warmup simulator
        run: xcrun simctl list > /dev/null
      - name: Download iOS platform SDK
        run: xcodebuild -downloadPlatform iOS
      - name: Build dylib
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamDylib-output
          path: VirtualCamDylib.dylib
